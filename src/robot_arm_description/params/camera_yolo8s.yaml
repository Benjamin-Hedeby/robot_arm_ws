# Must match the camera 'name' launch arg (oak_arm) -- a mismatched key silently
# loads none of these params, so the NN/IMU/calibration settings would be ignored.
/oak_arm:
  ros__parameters:
    camera:
      # i_enable_nn: true
      i_pipeline_type: RGBD
      i_nn_type: spatial
      i_enable_imu: true
      i_publish_tf_from_calibration: false
      # The find-pkg-share substitutions below resolve at launch (depthai's camera.launch.py
      # loads this file with allow_substs=True), so these paths work on any machine.
      # Don't write the dollar-paren substitution syntax in comments: it gets evaluated too.
      i_external_calibration_path: "$(find-pkg-share robot_arm_description)/params/custom_calib.json"
      i_tf_base_frame: "oak_arm"
      i_tf_parent_frame: "oak_d_s2"  
 
    rgb:
      i_publish_topic: true
      i_fps: 20.0                     # 20 FPS is plenty for WiFi & YOLO
      i_resolution: 1080P             # Good balance of quality/speed
      i_preview_width: 640             # MUST match your YOLO blob size (usually 640)
      i_preview_height: 640

    stereo:
      i_align_depth: true            # Aligns depth to RGB (Required for overlay)
      i_publish_topic: true          # Publish depth for debugging
      i_subpixel: true                # Better accuracy
      i_depth_filter_size: 5          # Smooths out noise

    nn:
      # The blob itself is NOT configurable from here -- depthai_ros_driver has no
      # blob-path parameter, and an undeclared one is dropped without a warning.
      # NNParamHandler::getModelPath builds the path from the json's "model" block
      # alone, so the blob lives in yolo8s.json.in (filled in at build time).
      i_nn_config_path: "$(find-pkg-share robot_arm_description)/params/yolo8s.json"
      i_num_shaves: 5             
      i_disable_resize: true

      spatial_network_configuration:
         i_bb_scale_factor: 0.5         # Measure depth in the center 50% of the box
         i_depth_threshold_lower: 100   # Ignore things closer than 10cm
         i_depth_threshold_upper: 10000 # Ignore things further than 10m
         i_calc_algo: "MEDIAN"
    
    imu:
      i_acc_freq: 400          # Accelerometer Hz (400 is standard)
      i_gyro_freq: 400         # Gyroscope Hz
      i_rot_freq: 100          # Rotation Vector (calculated orientation)
      i_batch_report_threshold: 1 # Publish every packet immediately (lower latency)
      i_max_batch_reports: 10     # Group packets if network is busy
